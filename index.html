
<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbar's Home Hub v3</title>
<style>
body{margin:0;font-family:system-ui;background:#f5f2ec}
header{background:#fff;padding:20px;position:sticky;top:0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.container{max-width:1400px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{padding:10px 14px;border:none;border-radius:10px;cursor:pointer}
.primary{background:#8a6f52;color:white}.danger{background:#c84b31;color:white}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:#fff;padding:15px;border-radius:16px;text-align:center}
.masonry{column-count:3;column-gap:16px}
@media(max-width:900px){.masonry{column-count:2}}
@media(max-width:600px){.masonry{column-count:1}}
.item{display:inline-block;width:100%;margin:0 0 16px}
.item img{width:100%;border-radius:12px}
.badge{padding:4px 8px;border-radius:20px;color:white;font-size:12px}
</style></head><body>
<header><h1>🏡 Inbar's Home Hub v3</h1></header>
<div class="container">

<div class="stats">
<div class="stat"><h2 id="totalItems">0</h2><div>פריטים</div></div>
<div class="stat"><h2 id="totalCost">₪0</h2><div>עלות</div></div>
</div>

<div class="card">
<h3 id="formTitle">הוספת פריט</h3>
<div class="grid">
<input id="name" placeholder="שם מוצר">
<select id="category"><option>סלון</option><option>חדר שינה</option></select>
<select id="condition"><option>חדש</option><option>יד שנייה</option></select>
<input id="store" placeholder="חנות">
<input id="price" type="number" placeholder="מחיר">
<input id="shipping" type="number" placeholder="משלוח">
<input id="link" placeholder="קישור">
<input id="imageUrl" placeholder="או הדביקי URL לתמונה">
<input type="file" id="image">
</div>
<textarea id="notes" placeholder="הערות"></textarea><br><br>
<button class="primary" onclick="saveItem()">שמור פריט</button>
</div>

<div id="items" class="masonry"></div>

</div>

<script>
let items=JSON.parse(localStorage.getItem('homehubv3')||'[]');
let editingId=null;

function qs(id){return document.getElementById(id);}

function saveStorage(){
 localStorage.setItem('homehubv3',JSON.stringify(items));
 render();
}

function saveItem(){
 const file=qs('image').files[0];

 const build=(img)=>{
   const obj={
    id:editingId||Date.now(),
    name:qs('name').value,
    category:qs('category').value,
    condition:qs('condition').value,
    store:qs('store').value,
    price:Number(qs('price').value||0),
    shipping:Number(qs('shipping').value||0),
    link:qs('link').value,
    notes:qs('notes').value,
    image:img
   };

   if(editingId){
      const idx=items.findIndex(x=>x.id===editingId);
      items[idx]=obj;
   }else{
      items.push(obj);
   }

   editingId=null;
   document.querySelectorAll('input,textarea').forEach(el=>{
      if(el.type!=='file') el.value='';
   });
   saveStorage();
 };

 if(file){
   const reader=new FileReader();
   reader.onload=e=>build(e.target.result);
   reader.readAsDataURL(file);
 }else{
   build(qs('imageUrl').value || 'https://via.placeholder.com/600x400');
 }
}

function editItem(id){
 const i=items.find(x=>x.id===id);
 editingId=id;
 qs('formTitle').innerText='עריכת פריט';
 qs('name').value=i.name;
 qs('category').value=i.category;
 qs('condition').value=i.condition;
 qs('store').value=i.store;
 qs('price').value=i.price;
 qs('shipping').value=i.shipping;
 qs('link').value=i.link;
 qs('notes').value=i.notes;
 qs('imageUrl').value=i.image.startsWith('http')?i.image:'';
 window.scrollTo({top:0,behavior:'smooth'});
}

function deleteItem(id){
 items=items.filter(x=>x.id!==id);
 saveStorage();
}

function render(){
 qs('items').innerHTML=items.map(i=>`
 <div class="card item">
 <img src="${i.image}">
 <h3>${i.name}</h3>
 <span class="badge" style="background:${i.condition==='חדש'?'green':'steelblue'}">${i.condition}</span>
 <p>${i.category}</p>
 <p>${i.store}</p>
 <p>₪${(i.price+i.shipping).toLocaleString()}</p>
 <a href="${i.link}" target="_blank">מוצר</a><br><br>
 <button class="primary" onclick="editItem(${i.id})">עריכה מלאה</button>
 <button class="danger" onclick="deleteItem(${i.id})">מחק</button>
 </div>
 `).join('');

 qs('totalItems').innerText=items.length;
 qs('totalCost').innerText='₪'+items.reduce((a,b)=>a+b.price+b.shipping,0).toLocaleString();
}

render();
</script>
</body></html>
