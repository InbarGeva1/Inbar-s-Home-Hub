<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestList v1</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px}
.container{max-width:1400px;margin:auto}
h1{text-align:center}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:white;padding:15px;border-radius:10px;text-align:center}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px}
.item img{width:100%;height:220px;object-fit:cover;border-radius:8px}
.small{font-size:.9em;color:#666}
</style>
</head>
<body>
<div class="container">
<h1>🏡 NestList v1</h1>

<div class="stats">
<div class="stat"><div>סה״כ פריטים</div><h2 id="totalItems">0</h2></div>
<div class="stat"><div>נקנו</div><h2 id="boughtItems">0</h2></div>
<div class="stat"><div>עלות כוללת</div><h2 id="totalCost">₪0</h2></div>
<div class="stat"><div>נפסלו</div><h2 id="rejectedItems">0</h2></div>
</div>

<div class="card">
<h3>הוספת פריט</h3>
<div class="grid">
<input id="name" placeholder="שם פריט">
<select id="category">
<option>סלון</option>
<option>חדר שינה</option>
</select>
<input id="store" placeholder="חנות">
<input id="price" type="number" placeholder="מחיר">
<input id="link" placeholder="קישור">
<select id="status">
<option>אופציה</option>
<option>בבדיקה</option>
<option>לקנייה</option>
<option>נקנה</option>
<option>נפסל</option>
</select>
<select id="rating">
<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>
</select>
<input type="file" id="image" accept="image/*">
</div>
<br>
<textarea id="notes" placeholder="הערות"></textarea>
<br><br>
<button class="primary" onclick="addItem()">הוסף</button>
</div>

<div class="card">
<div class="grid">
<input id="search" placeholder="חיפוש..." oninput="render()">
<select id="filterCategory" onchange="render()">
<option value="">כל הקטגוריות</option>
<option>סלון</option>
<option>חדר שינה</option>
</select>
<select id="filterStatus" onchange="render()">
<option value="">כל הסטטוסים</option>
<option>אופציה</option>
<option>בבדיקה</option>
<option>לקנייה</option>
<option>נקנה</option>
<option>נפסל</option>
</select>
</div>
</div>

<div class="card">
<h3>השוואת מחירים</h3>
<div id="comparison"></div>
</div>

<div id="items" class="items"></div>
</div>

<script>
let items = JSON.parse(localStorage.getItem('nestlist') || '[]');

function save(){
 localStorage.setItem('nestlist',JSON.stringify(items));
 render();
}

function addItem(){
 const file=document.getElementById('image').files[0];
 const reader=new FileReader();

 reader.onload=function(e){
  items.push({
   id:Date.now(),
   name:name.value,
   category:category.value,
   store:store.value,
   price:Number(price.value||0),
   link:link.value,
   status:status.value,
   rating:rating.value,
   notes:notes.value,
   image:e.target.result
  });
  save();
  document.querySelectorAll('input,textarea').forEach(x=>{if(x.type!="file")x.value='';});
 };

 if(file) reader.readAsDataURL(file);
 else reader.onload({target:{result:"https://via.placeholder.com/400x250?text=Furniture"}});
}

function removeItem(id){
 items=items.filter(x=>x.id!==id);
 save();
}

function editItem(id){
 const item=items.find(x=>x.id===id);
 const p=prompt("מחיר חדש",item.price);
 if(p!==null){item.price=Number(p);save();}
}

function render(){
 const search=document.getElementById('search').value.toLowerCase();
 const cat=document.getElementById('filterCategory').value;
 const stat=document.getElementById('filterStatus').value;

 let filtered=items.filter(i=>
   (!search || i.name.toLowerCase().includes(search) || i.store.toLowerCase().includes(search)) &&
   (!cat || i.category===cat) &&
   (!stat || i.status===stat)
 );

 document.getElementById('items').innerHTML=filtered.map(i=>`
 <div class="card item">
 <img src="${i.image}">
 <h3>${i.name}</h3>
 <div><b>${i.category}</b></div>
 <div>${i.store}</div>
 <div><b>₪${i.price.toLocaleString()}</b></div>
 <div>${"⭐".repeat(i.rating)}</div>
 <div>${i.status}</div>
 <div class="small">${i.notes||""}</div>
 <p><a href="${i.link}" target="_blank">למוצר</a></p>
 <button class="primary" onclick="editItem(${i.id})">ערוך מחיר</button>
 <button class="danger" onclick="removeItem(${i.id})">מחק</button>
 </div>`).join('');

 document.getElementById('totalItems').innerText=items.length;
 document.getElementById('boughtItems').innerText=items.filter(x=>x.status==="נקנה").length;
 document.getElementById('rejectedItems').innerText=items.filter(x=>x.status==="נפסל").length;
 document.getElementById('totalCost').innerText='₪'+items.reduce((a,b)=>a+b.price,0).toLocaleString();

 let groups={};
 items.forEach(i=>{
   if(!groups[i.name]) groups[i.name]=[];
   groups[i.name].push(i);
 });
 let html="";
 Object.keys(groups).forEach(name=>{
   if(groups[name].length>1){
     let min=Math.min(...groups[name].map(x=>x.price));
     html+=`<p><b>${name}</b> - המחיר הנמוך ביותר: ₪${min.toLocaleString()}</p>`;
   }
 });
 document.getElementById('comparison').innerHTML=html||"אין עדיין מוצרים להשוואה";
}
render();
</script>
</body>
</html>
